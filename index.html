<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeFrame — Smarter School Security</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f4d03f;
      --gold-dark: #b8860b;
      --gold-pale: #c9a227;
      --black: #0a0a0a;
      --black-light: #141414;
      --charcoal: #1a1a1a;
      --gray-dark: #2a2a2a;
      --gray: #888888;
      --gray-light: #c0c0c0;
      --white: #ffffff;
      --cream: #f5f0e1;
      --danger: #c0392b;
      --success: #27ae60;
      --glass: rgba(20, 20, 20, 0.85);
      --shadow-gold: 0 0 40px rgba(212, 175, 55, 0.15);
      --shadow-gold-strong: 0 0 60px rgba(212, 175, 55, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--black);
      color: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .script {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
    }

    /* Navigation */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      transition: all 0.3s ease;
    }

    .nav.scrolled {
      background: rgba(10, 10, 10, 0.98);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--white);
    }

    .nav-logo img {
      height: 48px;
      width: auto;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
    }

    .nav-logo-text {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.05em;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      color: var(--gray-light);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      transition: color 0.3s ease;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      transition: width 0.3s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--gold);
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }

    .nav-cta {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: var(--black);
      padding: 0.6rem 1.5rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
    }

    .nav-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--gold);
      font-size: 1.75rem;
      cursor: pointer;
      padding: 0.25rem;
    }

    /* Hero Section */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 8rem 2rem 4rem;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(180, 134, 11, 0.06) 0%, transparent 40%),
        linear-gradient(180deg, var(--black) 0%, var(--black-light) 100%);
      z-index: 1;
    }

    .hero-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 2;
      opacity: 0.6;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 1100px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-logo {
      width: 280px;
      max-width: 80vw;
      margin-bottom: 2.5rem;
      filter: drop-shadow(0 0 50px rgba(212, 175, 55, 0.25));
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 0.5rem 1.25rem;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.75rem;
      backdrop-filter: blur(10px);
    }

    .hero-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--gold);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.2); }
    }

    .hero h1 {
      font-size: clamp(2.25rem, 5vw, 4rem);
      line-height: 1.15;
      margin-bottom: 1.5rem;
      background: linear-gradient(180deg, var(--white) 0%, var(--gold-pale) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      max-width: 900px;
    }

    .hero-subtitle {
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      color: var(--gray-light);
      max-width: 700px;
      margin-bottom: 2.5rem;
      line-height: 1.7;
    }

    .hero-cta-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 4rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: var(--black);
      padding: 1rem 2.25rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-gold-strong);
    }

    .btn-secondary {
      background: transparent;
      color: var(--gold);
      padding: 1rem 2.25rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      border: 1px solid rgba(212, 175, 55, 0.4);
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-secondary:hover {
      background: rgba(212, 175, 55, 0.1);
      border-color: var(--gold);
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3rem;
      max-width: 700px;
      width: 100%;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      padding-top: 2.5rem;
    }

    .stat-number {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--gold);
      display: block;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.5rem;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      color: var(--gold);
      opacity: 0.6;
      animation: bounce 2s infinite;
      cursor: pointer;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(10px); }
    }

    /* Section Styling */
    section {
      position: relative;
    }

    .section-padding {
      padding: 6rem 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 4rem;
    }

    .section-tag {
      display: inline-block;
      color: var(--gold);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      padding: 0.35rem 1rem;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 50px;
    }

    .section-title {
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--white);
      margin-bottom: 1.25rem;
      line-height: 1.2;
    }

    .section-subtitle {
      font-size: 1.15rem;
      color: var(--gray-light);
      line-height: 1.8;
    }

    /* Problem Section */
    .problem {
      background: linear-gradient(180deg, var(--black-light) 0%, var(--charcoal) 100%);
    }

    .problem-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .problem-visual {
      position: relative;
    }

    .problem-image {
      width: 100%;
      border-radius: 16px;
      box-shadow: var(--shadow-gold);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .problem-card {
      background: var(--glass);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(10px);
    }

    .problem-card h2 {
      font-size: 2.25rem;
      margin-bottom: 1.5rem;
      color: var(--gold);
    }

    .problem-card p {
      font-size: 1.15rem;
      color: var(--gray-light);
      line-height: 1.8;
    }

    /* How It Works */
    .how-it-works {
      background: var(--black);
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    .step-card {
      background: linear-gradient(180deg, rgba(212, 175, 55, 0.08) 0%, rgba(20, 20, 20, 0.5) 100%);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 20px;
      padding: 2.5rem;
      position: relative;
      transition: all 0.4s ease;
      overflow: hidden;
    }

    .step-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .step-card:hover {
      transform: translateY(-8px);
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: var(--shadow-gold);
    }

    .step-card:hover::before {
      opacity: 1;
    }

    .step-number {
      font-family: 'Cinzel', serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: rgba(212, 175, 55, 0.2);
      line-height: 1;
      margin-bottom: 1rem;
    }

    .step-icon {
      width: 56px;
      height: 56px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }

    .step-card h3 {
      font-size: 1.35rem;
      margin-bottom: 0.75rem;
      color: var(--white);
    }

    .step-card p {
      color: var(--gray-light);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .feature-highlight {
      margin-top: 5rem;
      background: var(--charcoal);
      border-radius: 24px;
      padding: 4rem;
      border: 1px solid rgba(212, 175, 55, 0.15);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .feature-highlight h3 {
      font-size: 2rem;
      color: var(--gold);
      margin-bottom: 1.5rem;
    }

    .feature-highlight p {
      color: var(--gray-light);
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }

    .check-list {
      list-style: none;
    }

    .check-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 1rem;
      color: var(--gray-light);
    }

    .check-list li::before {
      content: '✓';
      color: var(--gold);
      font-weight: 700;
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      background: rgba(212, 175, 55, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    /* Why SafeFrame */
    .why {
      background: linear-gradient(180deg, var(--charcoal) 0%, var(--black-light) 100%);
    }

    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
    }

    .benefit-card {
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.12);
      border-radius: 16px;
      padding: 2rem;
      display: flex;
      gap: 1.25rem;
      transition: all 0.3s ease;
    }

    .benefit-card:hover {
      background: rgba(212, 175, 55, 0.05);
      border-color: rgba(212, 175, 55, 0.3);
      transform: translateX(8px);
    }

    .benefit-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(212, 175, 55, 0.05) 100%);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      flex-shrink: 0;
    }

    .benefit-content h3 {
      font-size: 1.15rem;
      margin-bottom: 0.5rem;
      color: var(--white);
    }

    .benefit-content p {
      font-size: 0.95rem;
      color: var(--gray);
      line-height: 1.6;
    }

    /* Pricing */
    .pricing {
      background: var(--black);
      position: relative;
    }

    .pricing-card {
      max-width: 700px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(212, 175, 55, 0.1) 0%, rgba(20, 20, 20, 0.8) 100%);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 24px;
      padding: 4rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .pricing-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .pricing-card h3 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: var(--gold);
      position: relative;
    }

    .pricing-card .price {
      font-family: 'Cinzel', serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--white);
      margin: 1.5rem 0;
      position: relative;
    }

    .pricing-card .price-note {
      color: var(--gray);
      font-size: 1rem;
      margin-bottom: 2rem;
      position: relative;
    }

    .pricing-features {
      list-style: none;
      text-align: left;
      max-width: 400px;
      margin: 0 auto 2.5rem;
      position: relative;
    }

    .pricing-features li {
      padding: 0.75rem 0;
      color: var(--gray-light);
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .pricing-features li::before {
      content: '✓';
      color: var(--gold);
      font-weight: 700;
    }

    /* Contact Form */
    .contact {
      background: linear-gradient(180deg, var(--black-light) 0%, var(--charcoal) 100%);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }

    .contact-info h2 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      color: var(--white);
    }

    .contact-info p {
      color: var(--gray-light);
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    .contact-email {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      margin-bottom: 1rem;
      color: var(--gold);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .contact-email:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold);
    }

    .contact-form {
      background: var(--glass);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 20px;
      padding: 2.5rem;
      backdrop-filter: blur(10px);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      color: var(--gray-light);
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      color: var(--white);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
      background: rgba(255, 255, 255, 0.08);
    }

    .form-group input.error,
    .form-group textarea.error,
    .form-group select.error {
      border-color: var(--danger);
    }

    .error-message {
      color: var(--danger);
      font-size: 0.8rem;
      margin-top: 0.4rem;
      display: none;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    /* Footer */
    .footer {
      background: var(--black);
      border-top: 1px solid rgba(212, 175, 55, 0.15);
      padding: 4rem 2rem 2rem;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 3rem;
      max-width: 1200px;
      margin: 0 auto 3rem;
    }

    .footer-brand img {
      height: 60px;
      margin-bottom: 1rem;
    }

    .footer-brand p {
      color: var(--gray);
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 300px;
    }

    .footer-links h4 {
      color: var(--gold);
      font-size: 1rem;
      margin-bottom: 1.25rem;
      letter-spacing: 0.05em;
    }

    .footer-links ul {
      list-style: none;
    }

    .footer-links li {
      margin-bottom: 0.75rem;
    }

    .footer-links a {
      color: var(--gray);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }

    .footer-links a:hover {
      color: var(--gold);
    }

    .footer-bottom {
      max-width: 1200px;
      margin: 0 auto;
      padding-top: 2rem;
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      color: var(--gray);
      font-size: 0.85rem;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
